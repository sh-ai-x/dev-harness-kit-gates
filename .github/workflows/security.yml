# Originally adapted from sh-ai-x/dev-harness-kit@<commit-sha>
# Source path: templates/ci/.github/workflows/security.yml
# Re-authored as a workflow_call reusable for the gates distribution.
# Phase 4 — dev-harness-kit-specific install paths were parameterized
# through inputs.* (plugin_repo, plugin_skill_path, install_token_secret,
# audit_marker). The verdict-extraction logic, bootstrap-PR fallback
# detection, severity gate, and audit comment format are universal and
# were kept verbatim.
name: security

on:
  workflow_call:
    inputs:
      gates_json_b64:
        description: base64-encoded JSON of `.dev-kit/gates.json` minus secrets
        type: string
        required: true
      provider:
        description: LLM provider for the judge (minimax | claude | codex)
        type: string
        required: true
        default: minimax
      model:
        description: provider model override; empty = provider default
        type: string
        required: false
        default: ""
      plugin_repo:
        description: "GitHub slug of the plugin source (default: dev-harness-kit)"
        type: string
        required: false
        default: "sh-ai-x/dev-harness-kit"
      plugin_skill_path:
        description: path to the skill file inside the plugin repo
        type: string
        required: false
        default: "skills/security/SKILL.md"
      install_token_secret:
        description: name of the secret holding the install token (PAT with contents:read on plugin_repo)
        type: string
        required: false
        default: "DEV_KIT_GITHUB_TOKEN"
      audit_marker:
        description: HTML marker used in audit comments
        type: string
        required: false
        default: "<!-- dev-kit-verdict-audit -->"
      pr_number:
        description: PR number the judge is reviewing
        type: string
        required: true
      pr_head_sha:
        description: PR head commit SHA (closes the agent→checkout TOCTOU)
        type: string
        required: true
      pr_is_from_fork:
        description: true when the PR head repo differs from the upstream repo (skip the agent run)
        type: string
        required: false
        default: "false"
      pr_updated_at:
        description: PR updated_at ISO timestamp (used as fallback cutoff for the PR-comments retry loop)
        type: string
        required: false
        default: ""
      run_id:
        description: GitHub Actions run id (used for the audit comment)
        type: string
        required: false
        default: "0"
    outputs:
      verdict:
        description: 'Approve | Changes Requested | Blocked | MISSING'
        value: ${{ jobs.security.outputs.verdict }}
      agent_ran:
        description: 'true | false'
        value: ${{ jobs.security.outputs.agent_ran }}
      verdict_source:
        description: 'classifier tag for the verdict (issue #625)'
        value: ${{ jobs.security.outputs.verdict_source }}
    secrets:
      install_token:
        description: token used to clone plugin_repo when the plugin source is private
        required: false

jobs:
  security:
    if: inputs.pr_is_from_fork != 'true'
    name: /dev-kit:security (10-dim OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
      agent_ran: ${{ steps.extract_verdict.outputs.agent_ran }}
      verdict_source: ${{ steps.extract_verdict.outputs.verdict_source }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
      MINIMAX_DEFAULT_MODEL: 'MiniMax-M3[1m]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.pr_head_sha }}
          fetch-depth: 1

      - name: Install plugin
        env:
          INSTALL_TOKEN: ${{ secrets.install_token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.claude/plugins/marketplaces
          if [ -f "$GITHUB_WORKSPACE/.claude-plugin/plugin.json" ] \
             && [ -d "$GITHUB_WORKSPACE/skills" ]; then
            ln -sfn "$GITHUB_WORKSPACE" "$HOME/.claude/plugins/marketplaces/plugin"
            echo "::notice::self-install: symlinked $GITHUB_WORKSPACE"
          else
            if [ -z "$INSTALL_TOKEN" ]; then
              echo "::error::secrets.install_token is required when the plugin source is private."
              echo "  Set up a fine-grained PAT with contents:read on ${{ inputs.plugin_repo }}"
              exit 1
            fi
            echo "::notice::consumer-install: cloning ${{ inputs.plugin_repo }}"
            git clone --depth 1 \
              "https://x-access-token:${INSTALL_TOKEN}@github.com/${{ inputs.plugin_repo }}.git" \
              ~/.claude/plugins/marketplaces/plugin
          fi
          test -f ~/.claude/plugins/marketplaces/plugin/.claude-plugin/plugin.json

      - name: Resolve provider + model
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          provider="${{ inputs.provider }}"
          model="${{ inputs.model }}"
          if [ -z "$model" ] && [ "$provider" = "minimax" ]; then
            model="${MINIMAX_DEFAULT_MODEL}"
          fi
          if [ -z "$model" ]; then
            echo "::warning::no model resolved; claude-code-action will use its default"
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Run security judge (minimax)
        if: steps.provider.outputs.provider == 'minimax'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.provider.outputs.model }}
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          track_progress: false
          prompt: |
            Load the security judge skill from $HOME/.claude/plugins/marketplaces/plugin/${{ inputs.plugin_skill_path }}
            (use the Read tool). Follow its protocol. After analysis, post the
            security summary as a single PR comment via:
              gh pr comment "${{ inputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)

            Map verdict per spec:
              - critical ≥ 1          → Verdict: Blocked
              - major  ≥ 1, no critical → Verdict: Changes Requested
              - no critical, no major → Verdict: Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run security judge (anthropic / codex)
        if: steps.provider.outputs.provider == 'anthropic' || steps.provider.outputs.provider == 'codex'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          prompt: |
            Load the security judge skill from $HOME/.claude/plugins/marketplaces/plugin/${{ inputs.plugin_skill_path }}
            (use the Read tool). Follow its protocol. After analysis, post the
            security summary as a single PR comment via:
              gh pr comment "${{ inputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Detect bootstrap-PR fallback
        id: fallback
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          workflow_files=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null \
            | grep -E '^\.github/workflows/.+\.ya?ml$' || true)
          if [ -n "$workflow_files" ]; then
            listed=$(echo "$workflow_files" | paste -sd, -)
            echo "::notice::PR modifies workflow files (${listed}); claude-code-action will skip."
            echo "needs_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fallback verdict comment
        if: steps.fallback.outputs.needs_fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          {
            echo "Verdict: Approve"
            echo
            echo "LLM security (10-dim OWASP) skipped -- workflow validation guard"
            echo
            echo "anthropics/claude-code-action@v1 refused to run because this PR modifies one or more files under .github/workflows/."
            echo
            echo "Action required: manual review of the workflow changes by a maintainer before merge."
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Extract security verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AUDIT_MARKER: ${{ inputs.audit_marker }}
          RUN_ID: ${{ inputs.run_id }}
          JOB_NAME: security
        run: |
          set -uo pipefail
          if [ "${{ steps.fallback.outputs.needs_fallback }}" = "true" ]; then
            echo "verdict=Approve" >> "$GITHUB_OUTPUT"
            echo "agent_ran=false" >> "$GITHUB_OUTPUT"
            echo "verdict_source=needs-fallback-bootstrap-pr" >> "$GITHUB_OUTPUT"
            audit_body="${AUDIT_MARKER} run=${RUN_ID} job=security status=${{ job.status }} verdict=Approve source=needs-fallback-bootstrap-pr"
            gh pr comment "$PR_NUMBER" --body "$audit_body"
            exit 0
          fi

          AGENT_OUTPUT="${{ runner.temp }}/claude-execution-output.json"
          if [ ! -f "$AGENT_OUTPUT" ]; then
            AGENT_OUTPUT="/home/runner/work/_temp/claude-execution-output.json"
          fi

          COMMENTS_FILE="${{ runner.temp }}/pr-comments-this-run.json"
          if [ "$RUN_ID" != "0" ]; then
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                --jq ".[] | select(.body | contains(\"run=${RUN_ID}\")) | {body: .body}" \
                > "$COMMENTS_FILE" 2>/dev/null || echo "[]" > "$COMMENTS_FILE"
          else
            echo "[]" > "$COMMENTS_FILE"
          fi

          file_verdict=""
          if [ -f "$AGENT_OUTPUT" ]; then
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract_verdict.py" "$AGENT_OUTPUT" "$COMMENTS_FILE" 2>/dev/null || echo '')"
          else
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract_verdict.py" /dev/null "$COMMENTS_FILE" 2>/dev/null || echo '')"
          fi

          verdict=""
          verdict_source=""
          agent_ran="false"
          if [ "$file_verdict" = "PARSE_FAILED" ]; then
            echo "::warning::security verdict missing (file=${AGENT_OUTPUT} produced no parseable 'Verdict:' line); gate will hard-fail with parse-failed-no-verdict remediation"
            verdict="PARSE_FAILED"
            verdict_source="parse-failed-no-verdict"
            agent_ran="true"
            CUTOFF="${{ inputs.pr_updated_at }}"
            comment_verdict=$(CUTOFF="$CUTOFF" JOB_NAME=security WORKSPACE="${{ github.workspace }}" "${{ github.workspace }}/scripts/verdict_comments_fallback.sh" "$PR_NUMBER" || true)
            if [ -n "$comment_verdict" ]; then
              verdict="$comment_verdict"
              verdict_source="comments-fallback"
              agent_ran="true"
            fi
          elif [ -n "$file_verdict" ]; then
            verdict="$file_verdict"
            if [ ! -f "$AGENT_OUTPUT" ]; then
              verdict_source="agent-pr-comment"
            else
              verdict_source="agent-output-file"
            fi
            agent_ran="true"
          else
            case "${{ job.status }}" in
              cancelled|failure)
                verdict=""
                verdict_source="default-no-verdict-job-${{ job.status }}"
                agent_ran="false"
                ;;
              *)
                verdict="Approve"
                verdict_source="default-approve-no-file"
                agent_ran="false"
                ;;
            esac
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${agent_ran}" >> "$GITHUB_OUTPUT"
          echo "verdict_source=${verdict_source}" >> "$GITHUB_OUTPUT"
          audit_body="${AUDIT_MARKER} run=${RUN_ID} job=security status=${{ job.status }} verdict=${verdict:-MISSING} source=${verdict_source:-unknown}"
          gh pr comment "$PR_NUMBER" --body "$audit_body"

  severity_gate:
    name: severity gate (security)
    runs-on: ubuntu-latest
    needs: [security]
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1

      - name: Security verdict gate
        run: |
          set -uo pipefail
          S="${{ needs.security.outputs.verdict }}"
          S_AGENT="${{ needs.security.outputs.agent_ran }}"
          S_SOURCE="${{ needs.security.outputs.verdict_source }}"
          S_RESULT="${{ needs.security.result }}"
          echo "security=$S (result=$S_RESULT, agent_ran=$S_AGENT, source=$S_SOURCE)"

          if [ "$S_AGENT" = "false" ]; then
            if [ "$S_SOURCE" = "needs-fallback-bootstrap-pr" ]; then
              echo "::notice::bootstrap-PR fallback: security agent skipped. Accepting synthesized Approve; human gate decides merge."
            else
              {
                echo "::error::security gate: AI agent was skipped (non-bootstrap)"
                echo "  security.agent_ran=$S_AGENT verdict=$S source=$S_SOURCE"
                echo
                echo "  anthropics/claude-code-action@v1 refused to run, but the"
                echo "  skip is NOT the documented bootstrap-PR case."
              } >&2
              exit 1
            fi
          fi

          if [ "$S_RESULT" = "failure" ]; then
            {
              echo "::error::security gate: upstream agent job failed"
              echo "  security.result=$S_RESULT verdict=$S"
            } >&2
            exit 1
          fi

          [ -z "$S" ] && { echo "::warning::security verdict missing; defaulting to Approve"; S="Approve"; }

          if [ "$S" = "PARSE_FAILED" ]; then
            {
              echo "::error::security gate: verdict parser failed"
              echo "  security.verdict=$S"
              echo "  The agent ran but produced no recognizable 'Verdict:' line."
            } >&2
            exit 1
          fi

          echo "Security verdict: $S"

          if ! { [ "$S" = "Approve" ] || [ "$S" = "Changes Requested" ] || [ "$S" = "Blocked" ]; }; then
            echo "::warning::Unparseable security verdict '$S'; treating as non-blocking."
            exit 0
          fi

          case "$S" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (security=$S)"; exit 1 ;;
            Blocked) echo "::error::Blocked (security=$S)"; exit 1 ;;
            *) echo "::error::Unparseable verdict '$S'"; exit 1 ;;
          esac

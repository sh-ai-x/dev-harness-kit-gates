# Originally adapted from sh-ai-x/dev-harness-kit@<commit-sha>
# Source path: templates/ci/.github/workflows/review.yml
# Re-authored as a workflow_call reusable for the gates distribution.
# Phase 4 — dev-harness-kit-specific install paths were parameterized
# through inputs.* (plugin_repo, plugin_skill_path, install_token_secret,
# audit_marker, bump_pr_skip_pattern). The verdict-extraction logic,
# bootstrap-PR fallback detection, severity gate, and audit comment format
# are universal and were kept verbatim. inputs.severity_gate_enabled
# (added post-Phase-4) lets a consumer disable the deterministic gate
# job while the judge agent keeps running -- restoring the source
# workflow's GATES_<NAME>_ENABLED semantics (agent always runs; only
# the CI hard-fail is toggleable).
name: review

on:
  workflow_call:
    inputs:
      gates_json_b64:
        description: >-
          base64-encoded JSON of `.dev-kit/gates.json` minus secrets.
          Not consumed by this workflow directly (it is only meaningful
          to the path-rule resolver, resolve-paths.yml, or action.yml) --
          optional so a caller that does not use path-rule-based gate
          selection isn't forced to fabricate a value.
        type: string
        required: false
        default: ""
      provider:
        description: >-
          Provider label (informational + used to pick a built-in default
          provider_base_url when provider_base_url is empty). Recognized
          labels with a built-in default: "minimax"
          (https://api.minimax.io/anthropic), "deepseek"
          (https://api.deepseek.com/anthropic). Any other value (e.g.
          "anthropic", "openai", "custom") is untouched -- pair it with an
          explicit provider_base_url for any Anthropic-Messages-API-
          compatible gateway, or leave provider_base_url empty for native
          Anthropic auth via claude-code-action's own anthropic_api_key path.
        type: string
        required: false
        default: minimax
      provider_base_url:
        description: >-
          Anthropic-Messages-API-compatible base URL for the selected
          provider. Empty + a recognized `provider` label uses that
          label's built-in default. Empty + an unrecognized label means
          native Anthropic auth. Set this explicitly to point at ANY
          provider not already recognized (OpenAI-compatible gateway,
          self-hosted proxy, a new vendor, etc.) without needing a code
          change to this workflow.
        type: string
        required: false
        default: ""
      model:
        description: provider model override; empty = provider default
        type: string
        required: false
        default: ""
      plugin_repo:
        description: "GitHub slug of the plugin source (default: dev-harness-kit)"
        type: string
        required: false
        default: "sh-ai-x/dev-harness-kit"
      plugin_skill_path:
        description: path to the skill file inside the plugin repo
        type: string
        required: false
        default: "skills/review/SKILL.md"
      install_token_secret:
        description: name of the secret holding the install token (PAT with contents:read on plugin_repo)
        type: string
        required: false
        default: "DEV_KIT_GITHUB_TOKEN"
      audit_marker:
        description: HTML marker used in audit comments
        type: string
        required: false
        default: "<!-- dev-kit-verdict-audit -->"
      severity_gate_enabled:
        description: >-
          When "false", the judge agent job still runs and posts its
          verdict comment, but the downstream deterministic severity_gate
          job is skipped entirely -- the human review-decision gate
          (REVIEW_REQUIRED / CHANGES_REQUESTED) is what blocks merge
          instead. Mirrors the .dev-kit/gates.json per-gate on/off
          switch from the dev-harness-kit consumer.
        type: string
        required: false
        default: "true"
      pr_number:
        description: PR number the judge is reviewing
        type: string
        required: true
      pr_head_sha:
        description: PR head commit SHA (closes the agent→checkout TOCTOU)
        type: string
        required: true
      pr_is_from_fork:
        description: true when the PR head repo differs from the upstream repo (skip the agent run)
        type: string
        required: false
        default: "false"
      pr_updated_at:
        description: PR updated_at ISO timestamp (used as fallback cutoff for the PR-comments retry loop)
        type: string
        required: false
        default: ""
      run_id:
        description: GitHub Actions run id (used for the audit comment)
        type: string
        required: false
        default: "0"
    outputs:
      verdict:
        description: 'Approve | Changes Requested | Blocked | MISSING'
        value: ${{ jobs.review.outputs.verdict }}
      agent_ran:
        description: 'true | false'
        value: ${{ jobs.review.outputs.agent_ran }}
      verdict_source:
        description: 'classifier tag for the verdict (issue #625)'
        value: ${{ jobs.review.outputs.verdict_source }}
    secrets:
      install_token:
        description: token used to clone plugin_repo when the plugin source is private
        required: false
      provider_api_key:
        description: >-
          API key for the selected provider. The consumer supplies their
          OWN key as a GitHub secret in their own repo and passes it here
          -- this workflow never provides, defaults, or stores a key.
          Used as both ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN when
          provider_base_url is set (proxied provider), or as
          claude-code-action's anthropic_api_key input when
          provider_base_url is empty (native Anthropic).
        required: false

jobs:
  review:
    # The caller owns the fork-safety guard via inputs.pr_is_from_fork;
    # workflow_call has no implicit pull_request context.
    if: inputs.pr_is_from_fork != 'true'
    name: /dev-kit:review (3-dim)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
      agent_ran: ${{ steps.extract_verdict.outputs.agent_ran }}
      verdict_source: ${{ steps.extract_verdict.outputs.verdict_source }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_head_sha }}
          fetch-depth: 1

      - name: Install plugin
        env:
          INSTALL_TOKEN: ${{ secrets.install_token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.claude/plugins/marketplaces
          # Self-aware install: if the checkout IS the plugin (has the
          # manifest + a skills/ directory), symlink it. Otherwise clone
          # plugin_repo via the install_token secret.
          if [ -f "$GITHUB_WORKSPACE/.claude-plugin/plugin.json" ] \
             && [ -d "$GITHUB_WORKSPACE/skills" ]; then
            ln -sfn "$GITHUB_WORKSPACE" "$HOME/.claude/plugins/marketplaces/plugin"
            echo "::notice::self-install: symlinked $GITHUB_WORKSPACE"
          else
            if [ -z "$INSTALL_TOKEN" ]; then
              echo "::error::secrets.install_token is required when the plugin source is private."
              echo "  Set up a fine-grained PAT with contents:read on ${{ inputs.plugin_repo }}"
              echo "  and pass it as the install_token secret when invoking this workflow."
              exit 1
            fi
            echo "::notice::consumer-install: cloning ${{ inputs.plugin_repo }}"
            git clone --depth 1 \
              "https://x-access-token:${INSTALL_TOKEN}@github.com/${{ inputs.plugin_repo }}.git" \
              ~/.claude/plugins/marketplaces/plugin
          fi
          test -f ~/.claude/plugins/marketplaces/plugin/.claude-plugin/plugin.json

      - name: Resolve provider base URL + model
        id: provider
        run: |
          set -euo pipefail
          provider="${{ inputs.provider }}"
          base_url="${{ inputs.provider_base_url }}"
          model="${{ inputs.model }}"
          # Explicit provider_base_url always wins. Otherwise fall back
          # to a built-in default for recognized labels; any other
          # label (including "anthropic", "openai", "custom", or simply
          # unset) resolves to empty -- native Anthropic auth.
          if [ -z "$base_url" ]; then
            case "$provider" in
              minimax)  base_url="https://api.minimax.io/anthropic" ;;
              deepseek) base_url="https://api.deepseek.com/anthropic" ;;
              *)        base_url="" ;;
            esac
          fi
          if [ -z "$model" ] && [ "$provider" = "minimax" ]; then
            model="MiniMax-M3[1m]"
          fi
          if [ -z "$model" ] && [ -n "$base_url" ]; then
            echo "::warning::no model resolved for a proxied provider (base_url=$base_url); pass inputs.model explicitly"
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Run review judge (proxied provider)
        if: steps.provider.outputs.base_url != ''
        env:
          ANTHROPIC_BASE_URL: ${{ steps.provider.outputs.base_url }}
          ANTHROPIC_API_KEY: ${{ secrets.provider_api_key }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.provider_api_key }}
          ANTHROPIC_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.provider.outputs.model }}
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          track_progress: false
          prompt: |
            Load the judge skill from $HOME/.claude/plugins/marketplaces/plugin/${{ inputs.plugin_skill_path }}
            (use the Read tool). Follow its protocol. After analysis, post the
            Layer-2 summary as a single PR comment via:
              gh pr comment "${{ inputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)

            Map verdict strictly to severity (do NOT inflate):
              - critical ≥ 1          → Verdict: Blocked
              - major  ≥ 1, no critical → Verdict: Changes Requested
              - no critical, no major → Verdict: Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run review judge (native anthropic)
        if: steps.provider.outputs.base_url == ''
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          anthropic_api_key: ${{ secrets.provider_api_key }}
          track_progress: false
          prompt: |
            Load the judge skill from $HOME/.claude/plugins/marketplaces/plugin/${{ inputs.plugin_skill_path }}
            (use the Read tool). Follow its protocol. After analysis, post the
            Layer-2 summary as a single PR comment via:
              gh pr comment "${{ inputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)

            Map verdict strictly to severity (do NOT inflate):
              - critical ≥ 1          → Verdict: Blocked
              - major  ≥ 1, no critical → Verdict: Changes Requested
              - no critical, no major → Verdict: Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Detect bootstrap-PR fallback
        id: fallback
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          # anthropics/claude-code-action@v1 skips when the PR head's
          # .github/workflows/*.yml differs from the default branch.
          workflow_files=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null \
            | grep -E '^\.github/workflows/.+\.ya?ml$' || true)
          if [ -n "$workflow_files" ]; then
            listed=$(echo "$workflow_files" | paste -sd, -)
            echo "::notice::PR modifies workflow files (${listed}); claude-code-action will skip."
            echo "needs_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fallback verdict comment
        if: steps.fallback.outputs.needs_fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          {
            echo "Verdict: Approve"
            echo
            echo "LLM review (3-dim) skipped -- workflow validation guard"
            echo
            echo "anthropics/claude-code-action@v1 refused to run because this PR modifies one or more files under .github/workflows/."
            echo
            echo "Action required: manual review of the workflow changes by a maintainer before merge."
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Extract review verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AUDIT_MARKER: ${{ inputs.audit_marker }}
          RUN_ID: ${{ inputs.run_id }}
          JOB_NAME: review
        run: |
          set -uo pipefail
          if [ "${{ steps.fallback.outputs.needs_fallback }}" = "true" ]; then
            echo "verdict=Approve" >> "$GITHUB_OUTPUT"
            echo "agent_ran=false" >> "$GITHUB_OUTPUT"
            echo "verdict_source=needs-fallback-bootstrap-pr" >> "$GITHUB_OUTPUT"
            audit_body="${AUDIT_MARKER} run=${RUN_ID} job=review status=${{ job.status }} verdict=Approve source=needs-fallback-bootstrap-pr"
            gh pr comment "$PR_NUMBER" --body "$audit_body"
            exit 0
          fi

          AGENT_OUTPUT="${{ runner.temp }}/claude-execution-output.json"
          if [ ! -f "$AGENT_OUTPUT" ]; then
            AGENT_OUTPUT="/home/runner/work/_temp/claude-execution-output.json"
          fi

          COMMENTS_FILE="${{ runner.temp }}/pr-comments-this-run.json"
          if [ "$RUN_ID" != "0" ]; then
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                --jq ".[] | select(.body | contains(\"run=${RUN_ID}\")) | {body: .body}" \
                > "$COMMENTS_FILE" 2>/dev/null || echo "[]" > "$COMMENTS_FILE"
          else
            echo "[]" > "$COMMENTS_FILE"
          fi

          file_verdict=""
          if [ -f "$AGENT_OUTPUT" ]; then
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract_verdict.py" "$AGENT_OUTPUT" "$COMMENTS_FILE" 2>/dev/null || echo '')"
          else
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract_verdict.py" /dev/null "$COMMENTS_FILE" 2>/dev/null || echo '')"
          fi

          verdict=""
          verdict_source=""
          agent_ran="false"
          if [ "$file_verdict" = "PARSE_FAILED" ]; then
            echo "::warning::review verdict missing (file=${AGENT_OUTPUT} produced no parseable 'Verdict:' line); gate will hard-fail with parse-failed-no-verdict remediation"
            verdict="PARSE_FAILED"
            verdict_source="parse-failed-no-verdict"
            agent_ran="true"
            CUTOFF="${{ inputs.pr_updated_at }}"
            comment_verdict=$(CUTOFF="$CUTOFF" JOB_NAME=review WORKSPACE="${{ github.workspace }}" "${{ github.workspace }}/scripts/verdict_comments_fallback.sh" "$PR_NUMBER" || true)
            if [ -n "$comment_verdict" ]; then
              verdict="$comment_verdict"
              verdict_source="comments-fallback"
              agent_ran="true"
            fi
          elif [ -n "$file_verdict" ]; then
            verdict="$file_verdict"
            if [ ! -f "$AGENT_OUTPUT" ]; then
              verdict_source="agent-pr-comment"
            else
              verdict_source="agent-output-file"
            fi
            agent_ran="true"
          else
            case "${{ job.status }}" in
              cancelled|failure)
                verdict=""
                verdict_source="default-no-verdict-job-${{ job.status }}"
                agent_ran="false"
                ;;
              *)
                verdict="Approve"
                verdict_source="default-approve-no-file"
                agent_ran="false"
                ;;
            esac
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${agent_ran}" >> "$GITHUB_OUTPUT"
          echo "verdict_source=${verdict_source}" >> "$GITHUB_OUTPUT"
          audit_body="${AUDIT_MARKER} run=${RUN_ID} job=review status=${{ job.status }} verdict=${verdict:-MISSING} source=${verdict_source:-unknown}"
          gh pr comment "$PR_NUMBER" --body "$audit_body"

  severity_gate:
    name: severity gate (review)
    runs-on: ubuntu-latest
    needs: [review]
    if: inputs.severity_gate_enabled != 'false'
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Review verdict gate
        run: |
          set -uo pipefail
          R="${{ needs.review.outputs.verdict }}"
          R_AGENT="${{ needs.review.outputs.agent_ran }}"
          R_SOURCE="${{ needs.review.outputs.verdict_source }}"
          R_RESULT="${{ needs.review.result }}"
          echo "review=$R (result=$R_RESULT, agent_ran=$R_AGENT, source=$R_SOURCE)"

          if [ "$R_AGENT" = "false" ]; then
            if [ "$R_SOURCE" = "needs-fallback-bootstrap-pr" ]; then
              echo "::notice::bootstrap-PR fallback: review agent skipped. Accepting synthesized Approve; human gate decides merge."
            else
              {
                echo "::error::review gate: AI agent was skipped (non-bootstrap)"
                echo "  review.agent_ran=$R_AGENT verdict=$R source=$R_SOURCE"
                echo
                echo "  anthropics/claude-code-action@v1 refused to run, but the"
                echo "  skip is NOT the documented bootstrap-PR case (verdict_source"
                echo "  is not 'needs-fallback-bootstrap-pr'). Most often this is"
                echo "  an install-broken or provider-transient signature."
                echo
                echo "  The gate does NOT default to Approve here -- that would mask"
                echo "  install bugs. Fix the upstream failure and re-run."
              } >&2
              exit 1
            fi
          fi

          if [ "$R_RESULT" = "failure" ]; then
            {
              echo "::error::review gate: upstream agent job failed"
              echo "  review.result=$R_RESULT verdict=$R"
              echo
              echo "  The judge never produced a verdict. Inspect the upstream"
              echo "  job logs for install/secret/provider issues."
            } >&2
            exit 1
          fi

          [ -z "$R" ] && { echo "::warning::review verdict missing; defaulting to Approve"; R="Approve"; }

          if [ "$R" = "PARSE_FAILED" ]; then
            {
              echo "::error::review gate: verdict parser failed"
              echo "  review.verdict=$R"
              echo "  The agent ran (output file existed + was parseable JSONL)"
              echo "  but no assistant message contained a recognizable"
              echo "  'Verdict:' line. Fix the agent's prompt or"
              echo "  scripts/extract_verdict.py."
            } >&2
            exit 1
          fi

          echo "Review verdict: $R"

          if ! { [ "$R" = "Approve" ] || [ "$R" = "Changes Requested" ] || [ "$R" = "Blocked" ]; }; then
            echo "::warning::Unparseable review verdict '$R'; treating as non-blocking."
            exit 0
          fi

          case "$R" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (review=$R)"; exit 1 ;;
            Blocked) echo "::error::Blocked (review=$R)"; exit 1 ;;
            *) echo "::error::Unparseable verdict '$R'"; exit 1 ;;
          esac
